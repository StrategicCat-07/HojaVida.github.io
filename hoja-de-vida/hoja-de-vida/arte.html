  <main>
    <h1>Arte abstracto</h1>
    <p>Formas, color y movimiento: una pausa visual hecha con SVG, sin imágenes externas.</p>
    <hr>

    <section class="galeria">
      <figure class="cuadro oculto">
        <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice">
          <rect width="300" height="260" fill="#fff3d6"/>
          <circle cx="90" cy="110" r="80" fill="#ff6b5b"/>
          <circle cx="190" cy="140" r="70" fill="#1fb5a8" opacity=".85"/>
          <rect x="150" y="30" width="90" height="90" rx="20" fill="#7b5cff" opacity=".9" transform="rotate(20 195 75)"/>
        </svg>
        <figcaption>Composición 1 · Círculos y equilibrio</figcaption>
      </figure>

      <figure class="cuadro oculto">
        <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice">
          <rect width="300" height="260" fill="#22202b"/>
          <path d="M0 200 Q75 100 150 180 T300 120" stroke="#ffb627" stroke-width="18" fill="none" stroke-linecap="round"/>
          <path d="M0 150 Q75 50 150 130 T300 70" stroke="#ff5fa2" stroke-width="18" fill="none" stroke-linecap="round"/>
          <path d="M0 230 Q75 150 150 220 T300 170" stroke="#1fb5a8" stroke-width="18" fill="none" stroke-linecap="round"/>
        </svg>
        <figcaption>Composición 2 · Ondas de color</figcaption>
      </figure>

      <figure class="cuadro oculto">
        <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice">
          <rect width="300" height="260" fill="#fffdf9"/>
          <polygon points="40,220 150,30 260,220" fill="#7b5cff"/>
          <polygon points="90,220 150,110 210,220" fill="#ffb627"/>
          <circle cx="235" cy="60" r="28" fill="#ff6b5b"/>
          <circle cx="60" cy="70" r="16" fill="#1fb5a8"/>
        </svg>
        <figcaption>Composición 3 · Geometría</figcaption>
      </figure>
    </section>
  </main>
